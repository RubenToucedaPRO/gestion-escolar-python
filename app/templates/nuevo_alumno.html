{% extends "layout.html" %}

{% block title %}Nuevo Alumno{% endblock %}

{% block content %}
    <h2>Registro de Nuevo Alumno</h2>
    
    <form action="{{ url_for('alumnos.crear') }}" method="POST" style="max-width: 400px;">
        <div style="margin-bottom: 10px;">
            <label>DNI:</label><br>
            <input type="text" name="dni" required>
        </div>
        <div style="margin-bottom: 10px;">
            <label>Nombre:</label><br>
            <input type="text" name="nombre" required>
        </div>
        <div style="margin-bottom: 10px;">
            <label>Email:</label><br>
            <input type="email" name="email" required>
        </div>
        
        <button type="submit" style="background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
            Guardar Alumno
        </button>
        <a href="{{ url_for('main.listar_usuarios') }}">Cancelar</a>
    </form>
{% endblock %}
