{% extends "layout.html" %}

{% block title %}Lista de alumnos{% endblock %}

{% block content %}
<div class="row my-4 align-items-center">
    <div class="col-sm-6">
        <h2 class="mb-0">Listado de Alumnos</h2>
    </div>
    <div class="col-sm-6 text-sm-end mt-2 mt-sm-0">
        <a href="{{ url_for('alumnos.formulario') }}" class="btn btn-success btn-sm">
            ➕ Alta Alumno
        </a>
    </div>
</div>
<div class="row mb-4">
    <div class="col-md-4">
        <form action="{{ url_for('alumnos.buscar') }}" method="POST">
            <div class="input-group input-group-sm">
                <input type="text" name="dni" class="form-control" placeholder="Buscar por DNI..." required>
                <button class="btn btn-primary" type="submit">🔍</button>
            </div>
        </form>
    </div>
</div>
<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>DNI</th>
                <th>Nombre</th>
                <th>Email</th>
                <th class="text-center">Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in alumnos %}
            <tr>
                <td>
                    <a href="{{ url_for('alumnos.detalle', dni=usuario.get_dni(), rol=usuario.get_rol()) }}"
                        class="fw-bold text-decoration-none">
                        {{ usuario.get_dni() }}
                    </a>
                </td>
                <td>{{ usuario.get_nombre() }}</td>
                <td>{{ usuario.get_email() }}</td>
                <td class="text-center">
                    <form action="{{ url_for('alumnos.eliminar', dni=usuario.get_dni()) }}" method="POST"
                        onsubmit="return confirm('¿Seguro que quieres eliminar este alumno?');" class="d-inline">
                        <button type="submit" class="btn btn-link text-danger p-0 border-0 fs-5" title="Eliminar">
                            🗑️
                        </button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
